name: AI Radar Weekly

on:
  schedule:
    # Every Monday 06:00 UTC. Edit as you like — cron is UTC always.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}   # lets you click "Run workflow" manually in the Actions tab

permissions:
  contents: write   # needed so the job can commit the generated dashboard back

jobs:
  build-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate dashboard
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RADAR_GH_TOKEN: ${{ secrets.RADAR_GH_TOKEN }}
        run: python scripts/generate_radar.py

      - name: Commit and push updated dashboard
        run: |
          git config user.name "ai-radar-bot"
          git config user.email "ai-radar-bot@users.noreply.github.com"
          git add docs/
          git diff --quiet --cached || git commit -m "Weekly AI Radar update ($(date -u +%Y-%m-%d))"
          git push
